<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <img src="../icons/icon48.png" width="28" height="28" alt="AI Translator">
      </div>
      <h1>AI Translator</h1>
    </header>

    <main class="main">
      <button id="translatePage" class="menu-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04z"/>
          <path d="M18.5 10l-4.5 12h2l1.12-3h4.75L23 22h2l-4.5-12h-2zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
        </svg>
        <span data-i18n="translateCurrentPage">Translate Page</span>
        <kbd data-i18n="translatePage">Full Page</kbd>
      </button>

      <button id="toggleFloatBall" class="menu-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12h8M12 8v8"/>
        </svg>
        <span data-i18n="floatBall">Float Ball</span>
        <kbd id="floatBallStatus" data-i18n="on">On</kbd>
      </button>

      <button id="toggleYoutubeCaptions" class="menu-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="M7 10h4M7 14h6"/>
        </svg>
        <span data-i18n="youtubeCaptions">YouTube Captions</span>
        <kbd id="youtubeCaptionsStatus" data-i18n="off">Off</kbd>
      </button>

      <!-- The entry point that does not depend on the context menu, which comic
           hosts routinely disable. -->
      <button id="comicTranslatePage" class="menu-item" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M12 3v18"/>
        </svg>
        <span data-i18n="comicTranslateThisPage">Translate Comic Page</span>
      </button>

      <button id="comicColorizePage" class="menu-item" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22a10 10 0 110-20c5.5 0 10 4 10 9a5 5 0 01-5 5h-2a2 2 0 00-1.5 3.3c.3.4.5.8.5 1.2a1.5 1.5 0 01-2 1.5z"/>
          <circle cx="7.5" cy="10.5" r="1"/>
          <circle cx="12" cy="7.5" r="1"/>
          <circle cx="16.5" cy="10.5" r="1"/>
        </svg>
        <span data-i18n="comicColorizeThisPage">Colorize Comic Page</span>
      </button>

      <!-- No account row here. Sign-in state and the monthly free allowance
           live in Settings, which is where a user goes to change them; the
           popup is a list of things to do right now, and a remote balance it
           had to fetch on every open was neither. -->

      <!-- PDF translation rides the same account as comics. The first button
           appears only when the active tab is itself a PDF; the second opens
           the local-file upload page and is always available while the feature
           is on. -->
      <button id="pdfTranslateCurrent" class="menu-item" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <span data-i18n="pdfTranslateThis">Translate This PDF</span>
      </button>

      <button id="pdfTranslateLocal" class="menu-item" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span data-i18n="pdfTranslateLocal">Translate a Local PDF…</span>
      </button>

      <!-- The most recent PDF jobs. Populated by popup.js; polls while the
           popup is open so a running job visibly moves. -->
      <div id="pdfJobs" class="pdf-jobs" hidden></div>

      <div class="divider"></div>

      <button id="openSettings" class="menu-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        <span data-i18n="openSettings">Settings</span>
      </button>
    </main>

    <footer class="footer">
      <span id="statusText" data-i18n="ready">Ready</span>
    </footer>
  </div>

  <script src="../i18n/messages.js"></script>
  <script src="../pdf/pdf-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
