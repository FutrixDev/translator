<!doctype html>
<meta charset="utf-8">
<title>Blab 导出</title>
<script src="icon.js"></script>
<script>
  // 每项按精确像素原生绘制（不做 dpr 缩放）
  const B = window.BlabR7;
  const INK = '#10172A';
  const ACCENT = '#4A55E8';
  const FONT = B.FONT;

  // 商店宣传图的插画底（promo/*-art.jpg，Magic Art 出图、画面不含文字），标志和文字在这里叠上去。
  const ART = {};
  // 可变字重要声明字重范围，否则 600–800 会被合成加粗
  window.ready = Promise.all([
    ...B.FACES.map(({ family, file, weight }) => new FontFace(family, `url(${file})`, { weight }).load()
      .then((face) => document.fonts.add(face))),
    ...['marquee', 'small'].map((key) => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(ART[key] = img);
      img.onerror = () => reject(new Error(`promo/${key}-art.jpg failed to load`));
      img.src = `promo/${key}-art.jpg`;
    })),
  ]);

  // 插画按 scale 缩放（默认按宽铺满）、靠右、竖向居中裁；左边露出的空带用插画
  // 最左 8px 的柔和底色横向拉满。左侧再压一层暖白，保证字的对比度
  function paintArt(ctx, img, w, h, washTo, scale = w / img.width) {
    const iw = img.width * scale, ih = img.height * scale, x0 = w - iw, y0 = (h - ih) / 2;
    if (x0 > 0) ctx.drawImage(img, 0, 0, 8, img.height, 0, y0, x0 + 1, ih);
    ctx.drawImage(img, x0, y0, iw, ih);
    const g = ctx.createLinearGradient(0, 0, washTo, 0);
    g.addColorStop(0, 'rgba(255,247,240,0.9)');
    g.addColorStop(0.6, 'rgba(255,247,240,0.55)');
    g.addColorStop(1, 'rgba(255,247,240,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, washTo, h);
  }
  function text(ctx, str, x, y, weight, size, color) {
    ctx.font = `${weight} ${size}px ${FONT}`;
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
    return x + ctx.measureText(str).width;
  }
  // 卖点：彩色勾选方块 + 粗体关键词 + 常规说明，颜色取自扇页
  const FEATURES = [
    ['#F0605A', 'Bilingual web pages', ', math and code kept'],
    ['#E89A1C', 'PDFs', ' translated with the layout intact'],
    ['#2FB67E', 'Dual subtitles', ' on YouTube and other players'],
    [ACCENT, 'EPUB, Word, MOBI', ', comics and images'],
  ];
  const MUTED = '#3B4258';
  function check(ctx, x, y, size, color) {
    ctx.beginPath();
    ctx.roundRect(x, y, size, size, size * 0.3);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + size * 0.27, y + size * 0.52);
    ctx.lineTo(x + size * 0.44, y + size * 0.68);
    ctx.lineTo(x + size * 0.74, y + size * 0.34);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = size * 0.13;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  function features(ctx, list, x, y, size, step) {
    for (const [color, lead, rest] of list) {
      check(ctx, x, y - size * 0.86, size * 1.05, color);
      const tx = text(ctx, lead, x + size * 1.6, y, 800, size, INK);
      if (rest) text(ctx, rest, tx, y, 600, size, MUTED);
      y += step;
    }
  }
  function pills(ctx, labels, x, y, size) {
    ctx.font = `700 ${size}px ${FONT}`;
    const padX = size * 0.85, hgt = size * 2;
    for (const label of labels) {
      const w = ctx.measureText(label).width + padX * 2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, hgt, hgt / 2);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(74,85,232,0.35)';
      ctx.lineWidth = Math.max(1, size / 12);
      ctx.stroke();
      ctx.fillStyle = ACCENT;
      ctx.fillText(label, x + padX, y + size * 1.37);
      x += w + size * 0.6;
    }
  }
  // Chrome 应用店大图 1400×560
  function drawPromoMarquee(ctx) {
    // 按高缩放：插画整体右移约 90px，文字栏到视频卡左边（约 x 650）为止
    paintArt(ctx, ART.marquee, 1400, 560, 820, 560 / ART.marquee.height);
    ctx.textBaseline = 'alphabetic';
    B.drawTile(ctx, 60, 92, 42);
    text(ctx, 'Blab Translation', 166, 85, 800, 34, INK);
    text(ctx, 'Translate everything,', 94, 168, 800, 50, INK);
    text(ctx, 'read it side by side.', 94, 226, 800, 50, ACCENT);
    features(ctx, FEATURES, 98, 286, 21, 38);
    pills(ctx, ['76 languages', 'Free on-device engine', 'Bring your own AI'], 96, 424, 16);
    const tx = text(ctx, 'Works with  ', 100, 500, 600, 16, MUTED);
    text(ctx, 'OpenAI  ·  Claude  ·  Gemini  ·  DeepSeek  ·  Ollama', tx, 500, 800, 16, MUTED);
  }
  // Chrome 应用店小图 440×280：文字止于浏览器窗左边（约 x 172）
  function drawPromoSmall(ctx) {
    paintArt(ctx, ART.small, 440, 280, 280);
    ctx.textBaseline = 'alphabetic';
    B.drawTile(ctx, 30, 24, 20);
    text(ctx, 'Blab', 24, 92, 800, 40, INK);
    text(ctx, 'Translation', 25, 118, 800, 21, INK);
    features(ctx, [
      ['#F0605A', 'Bilingual pages'],
      ['#E89A1C', 'PDF, EPUB, Word'],
      ['#2FB67E', 'Video subtitles'],
    ], 25, 152, 14, 23);
    text(ctx, '76 languages', 25, 236, 800, 15, ACCENT);
    text(ctx, 'Free or your own AI', 25, 256, 700, 13, MUTED);
  }
  const sq = (file, size, draw) => ({ file, w: size, h: size, draw: (ctx) => draw(ctx, size) });
  const EXPORTS = [
    ...[16, 32, 48, 128].map((s) => sq(`chrome/icon${s}.png`, s, B.drawTile)),
    ...[16, 32, 48, 128, 180, 192, 512].map((s) => sq(`web/icon${s}.png`, s, B.drawTile)),
    ...[['mdpi', 48], ['hdpi', 72], ['xhdpi', 96], ['xxhdpi', 144], ['xxxhdpi', 192]]
      .map(([d, s]) => sq(`android/mipmap-${d}/ic_launcher.png`, s, B.drawTile)),
    sq('android/mipmap-xxxhdpi/ic_launcher_foreground.png', 432, B.drawAdaptiveForeground),
    sq('android/mipmap-xxxhdpi/ic_launcher_background.png', 432, B.drawAdaptiveBackground),
    sq('android/play-store-512.png', 512, B.drawFullBleed),
    // The TV onboarding header's 30 design px land at 45 device px on a 1080p panel.
    sq('android/drawable-nodpi/brand_tile.png', 48, B.drawTile),
    { file: 'android/drawable-xhdpi/banner.png', w: 320, h: 180, draw: (ctx) => B.drawBanner(ctx, 320, 'TV Caption') },
    { file: 'android/drawable-zh-xhdpi/banner.png', w: 320, h: 180, draw: (ctx) => B.drawBanner(ctx, 320, '电视字幕') },
    { file: 'banner-translation-640x360.png', w: 640, h: 360, draw: (ctx) => B.drawBanner(ctx, 640) },
    sq('mark-1024.png', 1024, B.drawMark),
    sq('tile-1024.png', 1024, B.drawTile),
    { file: 'chrome/promo-large.png', w: 1400, h: 560, draw: drawPromoMarquee },
    { file: 'chrome/promo-small.png', w: 440, h: 280, draw: drawPromoSmall },
  ];
  function renderExport(i) {
    const e = EXPORTS[i];
    const c = document.createElement('canvas');
    c.width = e.w; c.height = e.h;
    e.draw(c.getContext('2d'));
    return c.toDataURL('image/png');
  }
</script>
